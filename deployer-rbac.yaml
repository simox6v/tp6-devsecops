apiVersion: v1
kind: ServiceAccount
metadata:
  name: tp-deployer
  namespace: tp6-secure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tp-deployer
  namespace: tp6-secure
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tp-deployer
  namespace: tp6-secure
subjects:
  - kind: ServiceAccount
    name: tp-deployer
    namespace: tp6-secure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tp-deployer
